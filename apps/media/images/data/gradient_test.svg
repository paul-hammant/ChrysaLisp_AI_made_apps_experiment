<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Test linearGradient -->

  <defs>
    <!-- Simple horizontal gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red"/>
      <stop offset="100%" stop-color="blue"/>
    </linearGradient>

    <!-- Vertical gradient -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="yellow"/>
      <stop offset="100%" stop-color="green"/>
    </linearGradient>

    <!-- Diagonal gradient -->
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="purple"/>
      <stop offset="50%" stop-color="white"/>
      <stop offset="100%" stop-color="orange"/>
    </linearGradient>

    <!-- Gradient with multiple stops -->
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red"/>
      <stop offset="25%" stop-color="orange"/>
      <stop offset="50%" stop-color="yellow"/>
      <stop offset="75%" stop-color="green"/>
      <stop offset="100%" stop-color="blue"/>
    </linearGradient>
  </defs>

  <!-- Row 1: Horizontal gradient -->
  <rect x="20" y="20" width="160" height="80" fill="url(#grad1)"/>
  <text x="100" y="120" text-anchor="middle" font-size="12">Horizontal</text>

  <!-- Row 1: Vertical gradient -->
  <rect x="220" y="20" width="160" height="80" fill="url(#grad2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="12">Vertical</text>

  <!-- Row 2: Diagonal gradient -->
  <rect x="20" y="140" width="160" height="80" fill="url(#grad3)"/>
  <text x="100" y="240" text-anchor="middle" font-size="12">Diagonal 3-stop</text>

  <!-- Row 2: Rainbow gradient -->
  <rect x="220" y="140" width="160" height="80" fill="url(#grad4)"/>
  <text x="300" y="240" text-anchor="middle" font-size="12">Rainbow</text>

  <!-- Circle with gradient -->
  <circle cx="100" cy="270" r="25" fill="url(#grad1)"/>
  <circle cx="300" cy="270" r="25" fill="url(#grad2)"/>
</svg>
