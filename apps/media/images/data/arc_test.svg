<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Test various arc commands -->

  <!-- Simple arc: half circle -->
  <path d="M 20,100 A 50,50 0 0,1 120,100" fill="none" stroke="#ff0000" stroke-width="2"/>

  <!-- Large arc flag test -->
  <path d="M 20,100 A 50,50 0 1,1 120,100" fill="none" stroke="#00ff00" stroke-width="2"/>

  <!-- Sweep direction test -->
  <path d="M 20,150 A 50,50 0 0,0 120,150" fill="none" stroke="#0000ff" stroke-width="2"/>

  <!-- Elliptical arc with rotation -->
  <path d="M 150,50 A 30,20 45 0,1 180,80" fill="none" stroke="#ff00ff" stroke-width="2"/>

  <!-- Relative arc (a command) -->
  <path d="M 150,120 a 30,30 0 1,0 40,40" fill="none" stroke="#00ffff" stroke-width="2"/>

  <!-- Closed shape with arcs -->
  <path d="M 100,30 A 20,20 0 1,1 100,70 A 20,20 0 1,1 100,30" fill="#ffff00" fill-opacity="0.5" stroke="#000000"/>
</svg>
