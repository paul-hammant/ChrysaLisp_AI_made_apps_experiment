<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Test SVG 1.1 named colors -->

  <!-- Row 1: Basic colors -->
  <rect x="10" y="10" width="30" height="30" fill="red"/>
  <rect x="50" y="10" width="30" height="30" fill="green"/>
  <rect x="90" y="10" width="30" height="30" fill="blue"/>
  <rect x="130" y="10" width="30" height="30" fill="yellow"/>
  <rect x="170" y="10" width="30" height="30" fill="cyan"/>
  <rect x="210" y="10" width="30" height="30" fill="magenta"/>
  <rect x="250" y="10" width="30" height="30" fill="white" stroke="black"/>
  <rect x="290" y="10" width="30" height="30" fill="black"/>

  <!-- Row 2: Extended colors -->
  <rect x="10" y="50" width="30" height="30" fill="orange"/>
  <rect x="50" y="50" width="30" height="30" fill="pink"/>
  <rect x="90" y="50" width="30" height="30" fill="purple"/>
  <rect x="130" y="50" width="30" height="30" fill="brown"/>
  <rect x="170" y="50" width="30" height="30" fill="gold"/>
  <rect x="210" y="50" width="30" height="30" fill="silver"/>
  <rect x="250" y="50" width="30" height="30" fill="navy"/>
  <rect x="290" y="50" width="30" height="30" fill="teal"/>

  <!-- Row 3: More colors -->
  <rect x="10" y="90" width="30" height="30" fill="coral"/>
  <rect x="50" y="90" width="30" height="30" fill="crimson"/>
  <rect x="90" y="90" width="30" height="30" fill="indigo"/>
  <rect x="130" y="90" width="30" height="30" fill="olive"/>
  <rect x="170" y="90" width="30" height="30" fill="maroon"/>
  <rect x="210" y="90" width="30" height="30" fill="lime"/>
  <rect x="250" y="90" width="30" height="30" fill="aqua"/>
  <rect x="290" y="90" width="30" height="30" fill="fuchsia"/>

  <!-- Row 4: Light colors -->
  <rect x="10" y="130" width="30" height="30" fill="lightblue"/>
  <rect x="50" y="130" width="30" height="30" fill="lightgreen"/>
  <rect x="90" y="130" width="30" height="30" fill="lightpink"/>
  <rect x="130" y="130" width="30" height="30" fill="lightyellow"/>
  <rect x="170" y="130" width="30" height="30" fill="lightgray"/>
  <rect x="210" y="130" width="30" height="30" fill="lightcoral"/>
  <rect x="250" y="130" width="30" height="30" fill="lightskyblue"/>
  <rect x="290" y="130" width="30" height="30" fill="lightsteelblue"/>

  <!-- Row 5: Dark colors -->
  <rect x="10" y="170" width="30" height="30" fill="darkblue"/>
  <rect x="50" y="170" width="30" height="30" fill="darkgreen"/>
  <rect x="90" y="170" width="30" height="30" fill="darkred"/>
  <rect x="130" y="170" width="30" height="30" fill="darkorange"/>
  <rect x="170" y="170" width="30" height="30" fill="darkviolet"/>
  <rect x="210" y="170" width="30" height="30" fill="darkcyan"/>
  <rect x="250" y="170" width="30" height="30" fill="darkgray"/>
  <rect x="290" y="170" width="30" height="30" fill="darkslategray"/>

  <!-- Row 6: Special colors with strokes -->
  <circle cx="25" cy="225" r="15" fill="tomato" stroke="darkred" stroke-width="2"/>
  <circle cx="65" cy="225" r="15" fill="steelblue" stroke="midnightblue" stroke-width="2"/>
  <circle cx="105" cy="225" r="15" fill="salmon" stroke="firebrick" stroke-width="2"/>
  <circle cx="145" cy="225" r="15" fill="khaki" stroke="goldenrod" stroke-width="2"/>
  <circle cx="185" cy="225" r="15" fill="plum" stroke="orchid" stroke-width="2"/>
  <circle cx="225" cy="225" r="15" fill="wheat" stroke="peru" stroke-width="2"/>
  <circle cx="265" cy="225" r="15" fill="honeydew" stroke="forestgreen" stroke-width="2"/>
  <circle cx="305" cy="225" r="15" fill="lavender" stroke="slateblue" stroke-width="2"/>

  <!-- Row 7: Grays -->
  <rect x="10" y="250" width="30" height="30" fill="gainsboro"/>
  <rect x="50" y="250" width="30" height="30" fill="lightgrey"/>
  <rect x="90" y="250" width="30" height="30" fill="silver"/>
  <rect x="130" y="250" width="30" height="30" fill="darkgrey"/>
  <rect x="170" y="250" width="30" height="30" fill="gray"/>
  <rect x="210" y="250" width="30" height="30" fill="dimgray"/>
  <rect x="250" y="250" width="30" height="30" fill="slategray"/>
  <rect x="290" y="250" width="30" height="30" fill="black"/>
</svg>
