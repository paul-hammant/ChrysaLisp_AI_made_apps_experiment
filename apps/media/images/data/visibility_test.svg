<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#cccccc"/>

  <!-- Visible rect (should show) -->
  <rect x="20" y="20" width="60" height="60" fill="red"/>

  <!-- Hidden rect (should NOT show) -->
  <rect x="70" y="20" width="60" height="60" fill="blue" visibility="hidden"/>

  <!-- Display none rect (should NOT show) -->
  <rect x="120" y="20" width="60" height="60" fill="green" display="none"/>

  <!-- Visible circle -->
  <circle cx="50" cy="130" r="30" fill="purple"/>

  <!-- Hidden group with circle -->
  <g visibility="hidden">
    <circle cx="100" cy="130" r="30" fill="orange"/>
  </g>

  <!-- Visible element inside group -->
  <g>
    <circle cx="150" cy="130" r="30" fill="cyan"/>
  </g>
</svg>
