<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ClipPath definition (parsing only, not applied) -->
    <clipPath id="testClip">
      <rect x="20" y="20" width="160" height="160"/>
    </clipPath>
  </defs>

  <!-- Simple shapes without clip-path applied -->
  <rect x="10" y="10" width="180" height="180" fill="#4488cc"/>
  <rect x="30" y="30" width="140" height="140" fill="#88cc44"/>
  <circle cx="100" cy="100" r="50" fill="#cc4488"/>
</svg>
